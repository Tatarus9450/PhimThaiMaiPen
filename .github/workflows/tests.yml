name: Application checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install GUI libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libegl1 libopengl0 libgl1 libxkbcommon0 libxcb-cursor0 libpulse0 desktop-file-utils python3-gi ffmpeg patch pulseaudio-utils
      - name: Install application test dependencies
        run: python scripts/install-app.py --python "$(command -v python)" --no-launcher
      - name: Check application and legacy regressions
        run: |
          .venv-app/bin/python -m unittest discover -s tests -v
          .venv-app/bin/python -m unittest test_asr_backend -v
          .venv-app/bin/python -m compileall -q phimthai scripts tests
          desktop-file-validate phimthai/assets/io.github.tatarus9450.PhimThaiMaiPen.desktop
