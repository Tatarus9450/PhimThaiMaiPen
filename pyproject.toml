[build-system]
requires = ["setuptools>=77,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "phimthai-maipen"
version = "2.0.0.dev2"
description = "Local Thai and English voice typing for Linux"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["PySide6>=6.8,<6.12", "dbus-next==0.2.3", "huggingface-hub>=0.34,<1", "webrtcvad-wheels==2.0.14", "soundfile>=0.13,<1"]

[project.optional-dependencies]
qwen = ["qwen-asr==0.0.6", "transformers==4.57.6", "sentencepiece>=0.2", "protobuf"]
intel = ["openvino-genai==2026.3.1.0"]

[project.scripts]
phimthai = "phimthai.app:main"

[tool.setuptools]
packages = ["phimthai"]
py-modules = ["typhoon_service", "typhoon_backend"]

[tool.setuptools.package-data]
phimthai = ["assets/*"]
